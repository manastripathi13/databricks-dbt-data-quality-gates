revenue_gold:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:                      # in-process Spark with Delta + the shared metastore (conf/spark-defaults.conf)
      type: spark
      method: session
      host: localhost
      schema: gold
    databricks:                 # same models on Azure Databricks (Unity Catalog)
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'adb-0000000000000000.0.azuredatabricks.net') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/set-me') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'set-me') }}"
      catalog: revenue
      schema: gold
